version: "3.7"

services:

  app_proxy:
    environment:
      # Umbrel injects app_proxy into this same compose project, so the nginx
      # service is reachable by its compose service name.
      APP_HOST: nginx
      APP_PORT: 80

  # Creates the data directories with the ownership each upstream image expects.
  # Umbrel's app data dir is otherwise owned by 1000:1000, which redpanda (uid 101)
  # cannot write to.
  init:
    image: busybox:1.36
    user: "0:0"
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /data/elastic /data/files /data/cr_data /data/cr_certs /data/redpanda
        # Only walk the tree when ownership actually drifted (first install, or a
        # restore), so restarts stay fast on a large Elasticsearch index.
        [ "$$(stat -c %u /data/elastic)" = 1000 ] || chown -R 1000:1000 /data/elastic
        [ "$$(stat -c %u /data/redpanda)" = 101 ] || chown -R 101:101 /data/redpanda
        chmod 700 /data/cr_certs
    volumes:
      - ${APP_DATA_DIR}/data:/data

  nginx:
    image: nginx:1.27-alpine
    restart: on-failure
    # nginx resolves every proxy_pass hostname once at startup and refuses to
    # start if one is missing, so it has to come up after everything it proxies.
    depends_on:
      - front
      - account
      - transactor
      - collaborator
      - rekoni
      - stats
    volumes:
      - ${APP_DATA_DIR}/nginx/huly.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        aliases:
          # Some services (front) use the same env var both for the URL they
          # hand the browser and for their own server-side calls. Resolving the
          # placeholder to nginx from inside the network makes both work.
          - huly-host.invalid

  cockroach:
    image: cockroachdb/cockroach:v24.2.5
    command: start-single-node --accept-sql-without-tls
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      - COCKROACH_DATABASE=defaultdb
      - COCKROACH_USER=selfhost
      - COCKROACH_PASSWORD=${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/cr_data:/cockroach/cockroach-data
      - ${APP_DATA_DIR}/data/cr_certs:/cockroach/certs
    healthcheck:
      # The entrypoint creates the database, the user and its grants on a
      # separate init node first. Only report healthy once the real node accepts
      # the credentials the Huly services use, otherwise they start against a
      # half-initialised cluster and crash-loop.
      test:
        - CMD-SHELL
        - cockroach sql --url "postgres://selfhost:${APP_PASSWORD}@localhost:26257/defaultdb?sslmode=require" -e "SELECT 1"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    environment:
      - REDPANDA_SUPERUSER_USERNAME=superadmin
      - REDPANDA_SUPERUSER_PASSWORD=${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --address ":9000" --console-address ":9001"
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/data/files:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  elastic:
    image: elasticsearch:7.14.2
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    volumes:
      - ${APP_DATA_DIR}/data/elastic:/usr/share/elasticsearch/data
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:8082
    healthcheck:
      interval: 20s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'

  rekoni:
    image: hardcoreeng/rekoni-service:v0.7.426
    restart: on-failure
    environment:
      - SECRET=${APP_SEED}
    deploy:
      resources:
        limits:
          memory: 500M

  stats:
    image: hardcoreeng/stats:v0.7.426
    restart: on-failure
    environment:
      - PORT=4900
      - SERVER_SECRET=${APP_SEED}

  transactor:
    image: hardcoreeng/transactor:v0.7.426
    restart: on-failure
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      - SERVER_PORT=3333
      - SERVER_SECRET=${APP_SEED}
      - DB_URL=postgres://selfhost:${APP_PASSWORD}@cockroach:26257/defaultdb
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - FRONT_URL=http://${APP_DOMAIN}:8087
      - ACCOUNTS_URL=http://account:3000
      - FULLTEXT_URL=http://fulltext:4700
      - STATS_URL=http://stats:4900
      - LAST_NAME_FIRST=true
      - QUEUE_CONFIG=redpanda:9092

  collaborator:
    image: hardcoreeng/collaborator:v0.7.426
    restart: on-failure
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=${APP_SEED}
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin

  account:
    image: hardcoreeng/account:v0.7.426
    restart: on-failure
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      - SERVER_PORT=3000
      - ACCOUNT_PORT=3000
      - SERVER_SECRET=${APP_SEED}
      - DB_URL=postgres://selfhost:${APP_PASSWORD}@cockroach:26257/defaultdb
      # Second entry is the endpoint handed to the browser. `huly-host.invalid` is
      # rewritten to the real Host by nginx/huly.conf on the way out.
      - TRANSACTOR_URL=ws://transactor:3333;ws://huly-host.invalid/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - FRONT_URL=http://${APP_DOMAIN}:8087
      # Server-side calls, so these must resolve inside the compose network /
      # from the device itself — not the rewritten placeholder host.
      - STATS_URL=http://stats:4900
      - ACCOUNTS_URL=http://${APP_DOMAIN}:8087/_accounts
      - MODEL_ENABLED=*
      - QUEUE_CONFIG=redpanda:9092

  workspace:
    image: hardcoreeng/workspace:v0.7.426
    restart: on-failure
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      - SERVER_SECRET=${APP_SEED}
      - DB_URL=postgres://selfhost:${APP_PASSWORD}@cockroach:26257/defaultdb
      - ACCOUNTS_DB_URL=postgres://selfhost:${APP_PASSWORD}@cockroach:26257/defaultdb
      - TRANSACTOR_URL=ws://transactor:3333;ws://${APP_DOMAIN}:8087/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092

  fulltext:
    image: hardcoreeng/fulltext:v0.7.426
    restart: on-failure
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      elastic:
        condition: service_healthy
    environment:
      - SERVER_SECRET=${APP_SEED}
      - DB_URL=postgres://selfhost:${APP_PASSWORD}@cockroach:26257/defaultdb
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=huly_storage_index
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092

  front:
    image: hardcoreeng/front:v0.7.426
    restart: on-failure
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=${APP_SEED}
      # Everything below lands in /config.json and is read by the browser, so the
      # placeholder host is rewritten per request by nginx/huly.conf.
      - ACCOUNTS_URL=http://huly-host.invalid/_accounts
      - ACCOUNTS_URL_INTERNAL=http://account:3000
      - REKONI_URL=http://huly-host.invalid/_rekoni
      - CALENDAR_URL=http://huly-host.invalid/_calendar
      - GMAIL_URL=http://huly-host.invalid/_gmail
      - TELEGRAM_URL=http://huly-host.invalid/_telegram
      - LOVE_ENDPOINT=http://huly-host.invalid/_love
      - STATS_URL=http://huly-host.invalid/_stats
      - COLLABORATOR_URL=ws://huly-host.invalid/_collaborator
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://elastic:9200
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - TITLE=Huly
      - DEFAULT_LANGUAGE=en
      - LAST_NAME_FIRST=true
      - DISABLED_FEATURES=auto-translate,mailboxes

  kvs:
    image: hardcoreeng/hulykvs:v0.7.426
    restart: on-failure
    depends_on:
      cockroach:
        condition: service_healthy
    environment:
      - HULY_DB_CONNECTION=postgres://selfhost:${APP_PASSWORD}@cockroach:26257/defaultdb
      - HULY_TOKEN_SECRET=${APP_SEED}
