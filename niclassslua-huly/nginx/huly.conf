# Huly reverse proxy for umbrelOS.
#
# Upstream huly-selfhost bakes a fixed HOST_ADDRESS into the service config, which
# does not work on Umbrel: the same instance is reached as umbrel.local:8087, as
# <lan-ip>:8087, over Tailscale, etc. Instead every externally-facing URL is
# configured with the placeholder host `huly-host.invalid` and rewritten here, per
# request, to whatever Host the browser actually used. Umbrel's app_proxy runs with
# changeOrigin:false, so $http_host is the browser's original Host header.
#
# Only the host is rewritten, not the scheme: Umbrel serves apps over plain HTTP,
# so the URLs stay http:// and ws://. If you put your own HTTPS reverse proxy in
# front of port 8087, change the schemes in docker-compose.yml to https/wss.

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # Served dynamically by the front service and read by the browser on load.
    # It carries ACCOUNTS_URL, UPLOAD_URL, COLLABORATOR_URL, STATS_URL, ...
    location = /config.json {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # sub_filter cannot rewrite a compressed body
        proxy_set_header Accept-Encoding "";

        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter 'huly-host.invalid' $http_host;

        proxy_pass http://front:8080;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://front:8080;
    }

    # Login/workspace responses hand the browser the transactor websocket endpoint,
    # so the placeholder has to be rewritten here too.
    location /_accounts {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Accept-Encoding "";

        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter 'huly-host.invalid' $http_host;

        rewrite ^/_accounts(/.*)$ $1 break;
        proxy_pass http://account:3000/;
    }

    location /_collaborator {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        rewrite ^/_collaborator(/.*)$ $1 break;
        proxy_pass http://collaborator:3078/;
    }

    location /_transactor {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        rewrite ^/_transactor(/.*)$ $1 break;
        proxy_pass http://transactor:3333/;
    }

    # Legacy transactor endpoint: the path is a raw JWT
    location ~ ^/eyJ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_pass http://transactor:3333;
    }

    location /_rekoni {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        rewrite ^/_rekoni(/.*)$ $1 break;
        proxy_pass http://rekoni:4004/;
    }

    location /_stats {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        rewrite ^/_stats(/.*)$ $1 break;
        proxy_pass http://stats:4900/;
    }
}
